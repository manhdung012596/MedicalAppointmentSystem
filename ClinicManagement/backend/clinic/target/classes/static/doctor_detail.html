<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bác Sĩ - Phòng Khám OOSD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-clinic-medical"></i> Phòng Khám OOSD</a>
            <a href="/" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row justify-content-center" id="doctor-content">
            <!-- Content will be loaded here -->
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p>© 2025 Y Tế Online. Mọi quyền được bảo lưu.</p>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Mock Data for Doctors
            const doctors = {
                1: {
                    name: "Bác sĩ Nguyễn Văn A",
                    specialty: "Răng hàm mặt",
                    exp: "10 năm",
                    image: "/anh/G.jpg",
                    desc: "Chuyên gia hàng đầu về phẫu thuật chỉnh hình răng mặt và cấy ghép Implant."
                },
                2: {
                    name: "Bác sĩ Trần Thị B",
                    specialty: "Thần kinh",
                    exp: "8 năm",
                    image: "/anh/bsnu1.jpg",
                    desc: "Tốt nghiệp Đại học Y Hà Nội, chuyên điều trị các bệnh lý đau đầu, mất ngủ và rối loạn tiền đình."
                },
                3: {
                    name: "Bác sĩ Lê Văn C",
                    specialty: "Mắt",
                    exp: "12 năm",
                    image: "/anh/E.jpg",
                    desc: "Trưởng khoa Mắt, chuyên phẫu thuật Phaco và điều trị tật khúc xạ."
                },
                4: {
                    name: "Bác sĩ Phạm Thị D",
                    specialty: "Tuyến vú",
                    exp: "9 năm",
                    image: "/anh/bsnu2.jpg",
                    desc: "Chuyên tầm soát và điều trị các bệnh lý tuyến vú lành tính và ác tính."
                },
                5: {
                    name: "Bác sĩ Hoàng Văn E",
                    specialty: "Da liễu",
                    exp: "11 năm",
                    image: "/anh/K.jpg",
                    desc: "Chuyên điều trị mụn, sẹo và các bệnh lý da liễu thẩm mỹ công nghệ cao."
                },
                6: {
                    name: "Bác sĩ Nguyễn Thị F",
                    specialty: "Ung bướu",
                    exp: "15 năm",
                    image: "/anh/bsnu3.jpg",
                    desc: "Chuyên gia tư vấn và điều trị ung thư với phác đồ tiên tiến nhất."
                }
            };

            // Get ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const container = document.getElementById("doctor-content");

            if (id && doctors[id]) {
                const doc = doctors[id];
                container.innerHTML = `
                    <div class="col-md-4 text-center">
                        <img src="${doc.image}" class="img-fluid rounded shadow-sm mb-4" alt="${doc.name}" style="max-height: 400px; object-fit: cover;">
                    </div>
                    <div class="col-md-8">
                        <h2 class="mb-3 text-primary">${doc.name}</h2>
                        <h5 class="text-muted mb-4">Chuyên khoa: <span class="badge bg-info text-dark">${doc.specialty}</span></h5>
                        
                        <div class="card mb-4 border-0 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fas fa-info-circle text-primary"></i> Thông tin bác sĩ</h5>
                                <p class="card-text">${doc.desc}</p>
                                <p class="card-text"><strong>Kinh nghiệm:</strong> ${doc.exp}</p>
                                <p class="card-text"><strong>Lịch làm việc:</strong> Thứ 2 - Thứ 6 (8:00 - 17:00)</p>
                            </div>
                        </div>

                        <div class="d-flex gap-3">
                            <button class="btn btn-primary btn-lg" onclick="openBooking()"><i class="fas fa-calendar-check"></i> Đặt lịch hẹn</button>
                            <button class="btn btn-outline-primary btn-lg" onclick="startChat()"><i class="fas fa-comments"></i> Tư vấn ngay</button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="col-12 text-center">
                        <h3 class="text-danger">Không tìm thấy thông tin bác sĩ!</h3>
                        <a href="/" class="btn btn-primary mt-3">Về trang chủ</a>
                    </div>
                `;
            }
        });

        function openBooking() {
            // Redirect to home and scroll to booking section
            window.location.href = "/#booking-section";
        }

        function startChat() {
            alert("Tính năng chat đang được bảo trì!");
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
