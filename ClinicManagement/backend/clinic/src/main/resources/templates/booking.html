<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đặt Lịch Khám</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white">
                        <h3 class="mb-0 text-center">Đăng Ký Khám Bệnh</h3>
                    </div>
                    <div class="card-body p-4">
                        <form action="/booking/save" method="post">

                            <h5 class="mb-3 text-muted">1. Thông tin bệnh nhân</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label>Họ và tên</label>
                                    <input type="text" name="fullName" class="form-control" required
                                        placeholder="Nguyễn Văn A">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Số điện thoại</label>
                                    <input type="tel" name="phone" class="form-control" required
                                        placeholder="09xxxxxxxx">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label>Email (nếu có)</label>
                                <input type="email" name="email" class="form-control" placeholder="user@example.com">
                            </div>
                            <div class="mb-3">
                                <label>Địa chỉ</label>
                                <input type="text" name="address" class="form-control" placeholder="Hà Nội...">
                            </div>

                            <hr>

                            <h5 class="mb-3 text-muted">2. Thông tin khám</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label>Chọn Khoa</label>
                                    <select name="departmentId" class="form-control">
                                        <option th:each="dept : ${departments}" th:value="${dept.id}"
                                            th:text="${dept.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Chọn Bác sĩ</label>
                                    <select name="doctorId" class="form-control">
                                        <option value="">Chọn bác sĩ (nếu biết)</option>
                                        <option th:each="doc : ${doctors}" th:value="${doc.id}"
                                            th:text="${doc.fullName + ' - ' + doc.specialty}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label>Ngày khám mong muốn</label>
                                    <input type="date" name="appointmentDateStr" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Giờ khám</label>
                                    <input type="time" name="appointmentTimeStr" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label>Triệu chứng / Ghi chú</label>
                                <textarea name="symptom" class="form-control" rows="3"
                                    placeholder="Ví dụ: Đau đầu, sốt nhẹ..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-success btn-lg btn-block">Xác Nhận Đặt Lịch</button>
                            <a href="/" class="btn btn-link btn-block text-muted">Quay lại trang chủ</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
