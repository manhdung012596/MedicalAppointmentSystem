<div th:fragment="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Lịch khám hôm nay</h3>
                        <div class="card-tools">
                            <button type="button" class="btn btn-tool" data-card-widget="collapse">
                                <i class="fas fa-minus"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered table-striped">
                            <thead>
                                <tr>
                                    <th>Thời gian</th>
                                    <th>Tên bệnh nhân</th>
                                    <th>Lý do khám</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="appt : ${appointments}">
                                    <td
                                        th:text="${appt.appointmentTime != null ? #temporals.format(appt.appointmentTime, 'dd/MM/yyyy HH:mm') : ''}">
                                    </td>
                                    <td th:text="${appt.patient != null ? appt.patient.fullName : 'N/A'}"></td>
                                    <td th:text="${appt.symptom}"></td>
                                    <td>
                                        <span th:if="${appt.status != null}"
                                            th:classappend="${appt.status.name() == 'PENDING'} ? 'badge badge-warning' : (${appt.status.name() == 'CONFIRMED'} ? 'badge badge-success' : 'badge badge-secondary')"
                                            th:text="${appt.status}"></span>
                                        <span th:unless="${appt.status != null}"
                                            class="badge badge-secondary">UNKNOWN</span>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm btn-primary">Khám</button>
                                        <button class="btn btn-sm btn-secondary">Hủy</button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(appointments)}">
                                    <td colspan="5" class="text-center">Chưa có lịch khám nào.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Lịch khám tuần này</h3>
                    </div>
                    <div class="card-body">
                        <div id="calendar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FullCalendar CSS & JS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js'></script>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: [
                    /* 
                    TODO: Inject events from backend
                    */
                    {
                        title: 'Khám Mẫu',
                        start: new Date().toISOString(),
                        end: new Date(new Date().getTime() + 30 * 60000).toISOString()
                    }
                ]
            });
            calendar.render();
        });
    </script>
</div>
