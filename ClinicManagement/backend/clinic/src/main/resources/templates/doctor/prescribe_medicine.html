<div th:fragment="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Kê đơn thuốc</h3>
          </div>
          <div class="card-body">
            <form>
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Tên thuốc</label>
                    <select class="form-control">
                      <option th:each="med : ${medicines}" th:value="${med.id}" th:text="${med.name}"></option>
                    </select>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-group">
                    <label>Số lượng</label>
                    <input type="number" class="form-control" value="10">
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-group">
                    <label>Liều dùng</label>
                    <input type="text" class="form-control" placeholder="2 viên/lần, 3 lần/ngày">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label>Lời dặn</label>
                <textarea class="form-control" rows="3" placeholder="Uống sau ăn, nghỉ ngơi đầy đủ..."></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Lưu đơn thuốc</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Lịch sử kê đơn</h3>
          </div>
          <div class="card-body">
            <table class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>Ngày</th>
                  <th>Bệnh nhân</th>
                  <th>Thuốc kê</th>
                  <th>Liều dùng</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="5" class="text-center">Chưa có dữ liệu kê đơn.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
