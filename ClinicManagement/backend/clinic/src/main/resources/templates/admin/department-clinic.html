<div th:fragment="content">
  <div class="container-fluid">
    <div class="row mb-4">
      <div class="col-12">
        <h2 class="text-danger font-weight-bold">
          <i class="fas fa-hospital-alt mr-2"></i> Quản Lý Khoa & Phòng Khám
        </h2>
      </div>
    </div>

    <div class="row">
      <!-- Cột Khoa -->
      <div class="col-md-6">
        <div class="card card-primary card-outline">
          <div class="card-header">
            <h3 class="card-title">Danh Sách Khoa</h3>
            <div class="card-tools">
              <button class="btn btn-sm btn-primary" data-toggle="modal" data-target="#modalDepartment">
                <i class="fas fa-plus"></i> Thêm Khoa
              </button>
            </div>
          </div>
          <div class="card-body p-0">
            <table class="table table-striped" id="deptTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên Khoa</th>
                  <th>Mô tả</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="dept : ${departments}">
                  <td th:text="${dept.id}"></td>
                  <td th:text="${dept.name}" class="font-weight-bold"></td>
                  <td th:text="${dept.description}"></td>
                  <td>
                    <a th:href="@{/admin/departments/{id}/edit(id=${dept.id})}" class="btn btn-xs btn-warning"><i
                        class="fas fa-edit"></i></a>
                    <a th:href="@{/admin/departments/{id}/delete(id=${dept.id})}" class="btn btn-xs btn-danger"
                      onclick="return confirm('Xóa khoa này?')"><i class="fas fa-trash"></i></a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(departments)}">
                  <td colspan="4" class="text-center">Chưa có khoa nào.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Cột Phòng Khám -->
      <div class="col-md-6">
        <div class="card card-success card-outline">
          <div class="card-header">
            <h3 class="card-title">Danh Sách Phòng Khám</h3>
            <div class="card-tools">
              <button class="btn btn-sm btn-success" data-toggle="modal" data-target="#modalRoom">
                <i class="fas fa-plus"></i> Thêm Phòng
              </button>
            </div>
          </div>
          <div class="card-body p-0">
            <table class="table table-striped" id="roomTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên Phòng</th>
                  <th>Thuộc Khoa</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="room : ${rooms}">
                  <td th:text="${room.id}"></td>
                  <td th:text="${room.name}" class="font-weight-bold"></td>
                  <td th:text="${room.department != null ? room.department.name : 'Chưa gán'}"></td>
                  <td>
                    <a th:href="@{/admin/rooms/{id}/edit(id=${room.id})}" class="btn btn-xs btn-warning"><i
                        class="fas fa-edit"></i></a>
                    <a th:href="@{/admin/rooms/{id}/delete(id=${room.id})}" class="btn btn-xs btn-danger"
                      onclick="return confirm('Xóa phòng này?')"><i class="fas fa-trash"></i></a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rooms)}">
                  <td colspan="4" class="text-center">Chưa có phòng nào.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Thêm Khoa -->
  <div class="modal fade" id="modalDepartment">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Thông Tin Khoa</h5>
          <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <form th:object="${departmentForm}" th:action="@{/admin/departments/save}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
              <label>Tên Khoa</label>
              <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            <div class="form-group">
              <label>Mô tả</label>
              <textarea class="form-control" th:field="*{description}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Lưu</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Thêm Phòng -->
  <div class="modal fade" id="modalRoom">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Thông Tin Phòng Khám</h5>
          <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <form th:object="${roomForm}" th:action="@{/admin/rooms/save}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
              <label>Tên Phòng</label>
              <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            <div class="form-group">
              <label>Thuộc Khoa</label>
              <select class="form-control" th:field="*{departmentId}">
                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"
                  th:selected="${roomForm.department != null and roomForm.department.id == dept.id}"></option>
              </select>
            </div>
            <button type="submit" class="btn btn-success btn-block">Lưu</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
</div>

<!-- Scripts Auto Open -->
<th:block th:fragment="extraScripts">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script th:inline="none">
    $(document).ready(function () {
      $('#deptTable').DataTable({
        "language": { "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/vi.json" },
        "pageLength": 5, "lengthMenu": [5, 10, 25],
        responsive: true
      });
      $('#roomTable').DataTable({
        "language": { "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/vi.json" },
        "pageLength": 5, "lengthMenu": [5, 10, 25],
        responsive: true
      });
    });
  </script>

  <script th:if="${editDeptMode}">
    $(document).ready(function () { $('#modalDepartment').modal('show'); });
  </script>
  <script th:if="${editRoomMode}">
    $(document).ready(function () { $('#modalRoom').modal('show'); });
  </script>
</th:block>
